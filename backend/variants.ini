[madchess]
maxFile = 8
maxRank = 8
pieceToCharTable = PNBRQKpnbrqk

# Use built-in piece types
pieceType = P:pawn N:knight B:bishop R:rook Q:queen K:king

# Game Rules
castling = true
enPassant = true
promotion = true
# Standard promotion: to Queen, Rook, Bishop, Knight
promotionPiece = qrbn

# Pawn Rules
# Allow pawns on 1st rank (index 0)
pawnStartRank = 0
# Enhance pawn rules if necessary, but built-in 'pawn' type should handle most standard moves
# If double step from rank 1 is needed: doubleStepRank = 0 (but usually pawns on rank 2 double step)
